//NE102 board config (TXW828-C08FL + GC20C3 1-lane MIPI + N32L403 PMU)
//Pin sources: custom/doc/NE102 系统IO与连接关系.md (schematic cross-checked)
//Params not listed here stay 0xFF (untouched). Do NOT copy learning-board
//entries: its FEM(PA/PC0/1), SD(PA6-13), UART0(PA11/12) pins are different.

//UART0 console -> the serial connector actually brought out on the device
//(swapped 2026-09-30: TX=PD13, RX=PD12 to match adapter wiring; arbitrary iomap)
PIN_UART0_TX 	= 	PD_13
PIN_UART0_RX 	= 	PD_12

//TF card: SDIO 1-bit (CLK=PB9, CMD=PB8, DAT0=PB10) + card supply switch PB7
PIN_SDH_CLK 	= 	PB_9
PIN_SDH_CMD 	= 	PB_8
PIN_SDH_DAT0 	= 	PB_10
//PIN_SDH_CLK_DRI_STRENGTH unset: 0xFF -> driver default GPIO_DS_G1

//camera GC20C3, MIPI CSI0 1-lane (clock on PA4/PA5 pads, data0 on PA2/PA3)
PIN_MIPI_CSI0_CLKP 	=	PA_4
PIN_MIPI_CSI0_CLKN 	=	PA_5
PIN_MIPI_CSI0_D0P	=	PA_2
PIN_MIPI_CSI0_D0N	=	PA_3
//sensor MCLK 24MHz generated on PWM channel 1 -> CSI_MCLK net (PC9)
PIN_PWM_CHANNEL_1	= 	PC_9
//camera I2C (CSI_SCL=PC11, CSI_SDA=PC10)
PIN_MIPI0_IIC_CLK = PC_11
PIN_MIPI0_IIC_SDA = PC_10
//sensor reset/powerdown
PIN_CSI0_RESET 	= 	PC_12
PIN_CSI0_PDN 	= 	PC_13
//camera power master switch (gates external sensor 1V2 rail, schematic p8)
PIN_CAM_EN = PB_6
//TF card supply switch (net SDIO_PWR_EN)
PIN_TF_PWR_EN = PB_7

//CPU1 (wireless core) logs are forwarded to CPU0's console (UART0) via RPC,
//so UART1 stays fully unused. PC6/PC7 (native USB DP/DM) are reserved for
//USB device mode on the Type-C connector.

//WiFi-Halow module SPI1 (reserved for later use, demo does not touch it)
PIN_SPI1_CS 	= 	PD_0
PIN_SPI1_CLK 	= 	PD_3
PIN_SPI1_IO0 	= 	PD_1
PIN_SPI1_IO1 	= 	PD_2
